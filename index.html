<html><head><base href="https://example.com"></head><body><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Touch Event Bot Detection Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            background-color: #f0f0f0;
            border-right: 2px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #sidebar h2 {
            margin-top: 0;
        }
        .user {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .user.green .indicator {
            background-color: green;
            animation: pulseGreen 2s infinite;
        }
        .user.red .indicator {
            background-color: red;
            animation: pulseRed 2s infinite;
        }
        @keyframes pulseGreen {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulseRed {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        #main {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
        }
        #touch-area {
            width: 80%;
            height: 80%;
            background-color: #e0e0e0;
            border: 3px dashed #999;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }
        #touch-area:active {
            background-color: #d0d0d0;
        }
        .avatar-icon {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .avatar-icon:hover {
            transform: scale(1.2);
            z-index: 10;
        }
        .avatar-tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .avatar-icon:hover .avatar-tooltip {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Connected Users</h2>
        <div id="users"></div>
    </div>
    <div id="main">
        <div id="touch-area"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/websimsocket/dist/websimsocket.min.js"></script>
    <script>
        const room = new WebsimSocket();

        const usersDiv = document.getElementById('users');
        const touchArea = document.getElementById('touch-area');

        // Store user touch events
        const touchEvents = {};
        const BOT_THRESHOLD = 21; // Max touches per minute
        const BOT_TIME_WINDOW = 60000; // 60 seconds

        // Initialize current user
        const currentUser = {
            id: room.party.client.id,
            username: room.party.client.username,
            avatarUrl: room.party.client.avatarUrl,
            isBot: false,
            touchTimestamps: []
        };
        touchEvents[currentUser.id] = currentUser;

        // Update user list UI
        function updateUserList() {
            usersDiv.innerHTML = '';
            for (const clientId in room.party.peers) {
                const user = touchEvents[clientId];
                const userDiv = document.createElement('div');
                userDiv.classList.add('user');
                userDiv.classList.add(user.isBot ? 'red' : 'green');
                
                const indicator = document.createElement('div');
                indicator.classList.add('indicator');
                userDiv.appendChild(indicator);
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = user.username;
                userDiv.appendChild(nameSpan);
                
                usersDiv.appendChild(userDiv);
            }
            // Include current user
            const currentUserDiv = document.createElement('div');
            currentUserDiv.classList.add('user');
            currentUserDiv.classList.add(currentUser.isBot ? 'red' : 'green');
            
            const currentIndicator = document.createElement('div');
            currentIndicator.classList.add('indicator');
            currentUserDiv.appendChild(currentIndicator);
            
            const currentNameSpan = document.createElement('span');
            currentNameSpan.textContent = currentUser.username + ' (You)';
            currentUserDiv.appendChild(currentNameSpan);
            
            usersDiv.appendChild(currentUserDiv);
        }

        // Detect bots based on touch event rate
        function detectBot(user) {
            const now = Date.now();
            // Remove timestamps older than time window
            user.touchTimestamps = user.touchTimestamps.filter(ts => now - ts <= BOT_TIME_WINDOW);
            if (user.touchTimestamps.length > BOT_THRESHOLD) {
                user.isBot = true;
            } else {
                user.isBot = false;
            }
        }

        // Handle touch events
        function handleTouch(x, y) {
            const now = Date.now();
            currentUser.touchTimestamps.push(now);
            detectBot(currentUser);
            updateUserList();

            // Create avatar icon
            createAvatarIcon(x, y, currentUser, now);

            // Send touch event to peers
            room.send({
                type: "touchEvent",
                timestamp: now,
                userId: currentUser.id,
                username: currentUser.username,
                avatarUrl: currentUser.avatarUrl,
                x: x,
                y: y
            });
        }

        function createAvatarIcon(x, y, user, timestamp) {
            const avatarIcon = document.createElement('div');
            avatarIcon.classList.add('avatar-icon');
            avatarIcon.style.left = `${x}px`;
            avatarIcon.style.top = `${y}px`;
            avatarIcon.style.backgroundImage = `url(${user.avatarUrl})`;
            avatarIcon.style.backgroundSize = 'cover';

            const tooltip = document.createElement('div');
            tooltip.classList.add('avatar-tooltip');
            tooltip.textContent = `${user.username} - ${new Date(timestamp).toLocaleString()} - ${user.isBot ? 'Bot' : 'Human'}`;

            avatarIcon.appendChild(tooltip);
            touchArea.appendChild(avatarIcon);

            // Remove icon after 5 seconds
            setTimeout(() => {
                touchArea.removeChild(avatarIcon);
            }, 5000);
        }

        // Handle incoming messages
        room.onmessage = (event) => {
            const data = event.data;
            if (data.type === "touchEvent") {
                const { timestamp, userId, username, avatarUrl, x, y } = data;
                if (!touchEvents[userId]) {
                    touchEvents[userId] = {
                        id: userId,
                        username: username,
                        avatarUrl: avatarUrl,
                        isBot: false,
                        touchTimestamps: []
                    };
                }
                touchEvents[userId].touchTimestamps.push(timestamp);
                detectBot(touchEvents[userId]);
                updateUserList();
                createAvatarIcon(x, y, touchEvents[userId], timestamp);
            }
        };

        // Handle new peers
        room.onPeersChanged = (peers) => {
            // Add new peers to touchEvents
            for (const clientId in peers) {
                if (!touchEvents[clientId]) {
                    touchEvents[clientId] = {
                        id: clientId,
                        username: peers[clientId].username,
                        avatarUrl: peers[clientId].avatarUrl,
                        isBot: false,
                        touchTimestamps: []
                    };
                }
            }
            // Remove disconnected peers
            for (const clientId in touchEvents) {
                if (clientId !== currentUser.id && !peers[clientId]) {
                    delete touchEvents[clientId];
                }
            }
            updateUserList();
        };

        // Initial user list update
        updateUserList();

        // Touch event listeners
        touchArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = touchArea.getBoundingClientRect();
            handleTouch(touch.clientX - rect.left, touch.clientY - rect.top);
        });
        touchArea.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const rect = touchArea.getBoundingClientRect();
            handleTouch(e.clientX - rect.left, e.clientY - rect.top);
        });

        // Sync store on new connection
        room.onConnected = () => {
            room.store.getAll().then(store => {
                // Here you can sync store data if needed
            });
        };

        // Periodically check for bot status
        setInterval(() => {
            detectBot(currentUser);
            updateUserList();
            for (const clientId in touchEvents) {
                detectBot(touchEvents[clientId]);
            }
            updateUserList();
        }, 5000);
    </script>
